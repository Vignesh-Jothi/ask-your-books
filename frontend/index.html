<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Your Books</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>
          <div class="brand-name">Ask&nbsp;Your&nbsp;Books</div>
          <div class="brand-tag">Multi-tenant accounting assistant · read-only · org-scoped</div>
        </div>
      </div>
      <label class="field-label" for="user-select">Asking as</label>
      <select id="user-select" class="select">
        <option value="U301">U301 · Acme Industries (ORG3)</option>
        <option value="U302">U302 · Admin — Acme (ORG3)</option>
        <option value="U201">U201 · Beta Works (ORG2)</option>
      </select>
    </header>

    <main class="chat-area" id="chat-area" aria-live="polite">
      <div class="welcome-card">
        <h1>Ask a question about your books</h1>
        <p class="muted">Number answers come from guarded, tenant-scoped SQL. Nothing is written, nothing leaves your org. Try one:</p>
        <div class="suggestions" role="list">
          <button class="chip" data-q="Who owes us the most this year?">Who owes us the most this year?</button>
          <button class="chip" data-q="How are our receivables ageing?">How are our receivables ageing?</button>
          <button class="chip" data-q="What were our total sales this year?">What were our total sales this year?</button>
          <button class="chip" data-q="How much did we spend last quarter compared to the same quarter last year?">Expense vs same quarter last year</button>
        </div>
      </div>
    </main>

    <form id="ask-form" class="composer">
      <textarea id="question" rows="1" placeholder="Ask about receivables, expenses, sales, ageing…" autocomplete="off"></textarea>
      <button type="submit" class="button button-primary" id="send-button">
        <span class="send-label">Ask</span>
      </button>
    </form>
    <footer class="status-bar" id="status-bar">Ready</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
