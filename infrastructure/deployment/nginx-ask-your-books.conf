# Ask Your Books — nginx reverse proxy (TLS termination + rate limiting)
#
#   include /etc/nginx/sites-enabled/ask-your-books.conf
#
# Rate limits are per-IP, not per-user: real systems should key on the
# X-User-Id header via a map (the API itself also caps iterations/rows).
limit_req_zone $binary_remote_addr zone=chat_api:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name ask.example.com;

    ssl_certificate     /etc/letsencrypt/live/ask.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ask.example.com/privkey.pem;

    # UI (static) and API through the same vhost
    location /api/ {
        limit_req zone=chat_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name ask.example.com;
    return 301 https://$host$request_uri;
}